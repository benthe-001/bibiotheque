server.port=8080

# --- Base de donnees (valeurs par defaut pour le dev ; variables d'environnement en prod) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bibliotheque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# --- JWT (externalise : definissez JWT_SECRET et JWT_VALIDITY_SECONDS en prod) ---
jwt.secret=${JWT_SECRET:bibliotheque-dev-secret-a-remplacer-en-prod-9f2c4a7e}
jwt.validity-seconds=${JWT_VALIDITY_SECONDS:18000}

# --- CORS (externalise : definissez APP_CORS_ALLOWED_ORIGINS en prod, origines separees par des virgules) ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
hibernate.format_sql=true

spring.main.allow-circular-references=true