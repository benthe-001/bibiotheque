<table class="table table-success table-striped table-hover reservation-table">
  <thead>
    <tr>
      <th>Livre</th>
      <th>Adhérent</th>
      <th>Statut</th>
      <th>Date de réservation</th>
      <th>Date d'expiration</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let reservation of reservations">
      <td class="livre-titre">{{ reservation.livreTitre }}</td>
      <td>{{ reservation.adherentNom }}</td>
      <td>
        <span class="badge fw-bold" [ngClass]="{
          'bg-warning text-dark': reservation.statut === 'EN_ATTENTE',
          'bg-success text-white': reservation.statut === 'DISPONIBLE',
          'bg-secondary text-white': reservation.statut === 'ANNULEE',
          'bg-danger text-white': reservation.statut === 'EXPIREE',
          'bg-primary text-white': reservation.statut === 'HONOREE'
        }">{{ reservation.statut }}</span>
      </td>
      <td>{{ formaterDate(reservation.dateReservation) }}</td>
      <td>{{ formaterDate(reservation.dateExpiration) }}</td>
      <td>
        <button *ngIf="reservation.statut === 'EN_ATTENTE' || reservation.statut === 'DISPONIBLE'"
                class="btn btn-warning btn-sm"
                [disabled]="annulationEnCours === reservation.id || reservationAConfirmer !== null"
                (click)="confirmerAnnulation(reservation.id)">
          <span *ngIf="annulationEnCours === reservation.id" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          {{ annulationEnCours === reservation.id ? 'Annulation...' : 'Annuler' }}
        </button>
        <div *ngIf="reservationAConfirmer === reservation.id" class="confirmation-annulation" role="group" aria-label="Confirmation de l'annulation">
          <span>Annuler cette réservation ?</span>
          <button type="button" class="btn btn-danger btn-sm" (click)="validerAnnulation(reservation.id)">Confirmer</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="abandonnerAnnulation()">Garder</button>
        </div>
        <span *ngIf="reservation.statut !== 'EN_ATTENTE' && reservation.statut !== 'DISPONIBLE'" class="text-muted">—</span>
      </td>
    </tr>
  </tbody>
</table>
