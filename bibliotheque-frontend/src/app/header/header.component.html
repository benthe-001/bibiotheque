<header>
  <nav class="navbar navbar-expand-lg app-navbar navbar-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" routerLink="/">
        <span class="brand-icone">📚</span> Bibliothèque
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item" *ngIf="userService.roleMatch(['Admin'])">
            <a routerLink="/books" routerLinkActive="nav-active" class="nav-link">Livres</a>
          </li>

          <li class="nav-item" *ngIf="userService.roleMatch(['Admin'])">
            <a routerLink="/create-book" routerLinkActive="nav-active" class="nav-link">Ajouter un livre</a>
          </li>

          <li class="nav-item" *ngIf="userService.roleMatch(['Admin'])">
            <a routerLink="/users" routerLinkActive="nav-active" class="nav-link">Adhérents</a>
          </li>

          <li class="nav-item" *ngIf="userService.roleMatch(['Admin'])">
            <a routerLink="/register-user" routerLinkActive="nav-active" class="nav-link">Créer un compte</a>
          </li>

          <li class="nav-item" *ngIf="userService.roleMatch(['User'])">
            <a routerLink="/borrow-book" routerLinkActive="nav-active" class="nav-link">Emprunter</a>
          </li>

          <li class="nav-item" *ngIf="userService.roleMatch(['User'])">
            <a routerLink="/return-book" routerLinkActive="nav-active" class="nav-link">Retourner</a>
          </li>

          <li class="nav-item" *ngIf="userService.roleMatch(['Admin']) || userService.roleMatch(['User'])">
            <a routerLink="/reservations" routerLinkActive="nav-active" class="nav-link">Réservations</a>
          </li>

        </ul>

        <div class="d-flex align-items-center gap-2">
          <ng-container *ngIf="isLoggedIn()">
            <span class="user-chip" title="Utilisateur connecté">
              <span class="user-avatar">{{ initiale }}</span>
              <span class="user-nom">{{ name }}</span>
            </span>
            <button type="button" class="btn btn-outline-light btn-sm" (click)="logout()">Déconnexion</button>
          </ng-container>
          <button *ngIf="!isLoggedIn()" type="button" class="btn btn-light btn-sm fw-semibold" routerLink="/login">Connexion</button>
        </div>
      </div>
    </div>
  </nav>
</header>
