<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="app-card">
      <div class="text-center mb-4">
        <div class="login-icone">📚</div>
        <h2 class="page-title">Connexion</h2>
        <p class="page-subtitle mb-0">Accédez à votre espace bibliothèque.</p>
      </div>

      <div *ngIf="messageErreur" class="alert alert-danger" role="alert">{{ messageErreur }}</div>

      <form autocomplete="off" #loginForm="ngForm" (ngSubmit)="login(loginForm)">
        <div class="mb-3">
          <label class="form-label" for="loginUsername">Identifiant</label>
          <input type="text" name="username" ngModel required class="form-control" id="loginUsername" placeholder="Votre identifiant">
          <div class="form-text">L'identifiant vous a été fourni par le bibliothécaire.</div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="loginPassword">Mot de passe</label>
          <input type="password" name="password" ngModel required class="form-control" id="loginPassword" placeholder="Votre mot de passe">
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || connexionEnCours">
          <span *ngIf="connexionEnCours" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          {{ connexionEnCours ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
    </div>
  </div>
</div>
